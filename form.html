<form id="embedded-form">
    <div>
        <label for="first_name">First Name</label>
        <input type="text" id="first_name" name="first_name" required>
    </div>

    <div>
        <label for="last_name">Last Name</label>
        <input type="text" id="last_name" name="last_name" required>
    </div>

    <div>
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>
    </div>

    <div>
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone">
    </div>

    <div>
        <label for="message">How can we help?</label>
        <textarea id="message" name="message" rows="5" required></textarea>
    </div>
    <button type="submit">Submit</button>
</form>

<script>
document.getElementById('embedded-form').addEventListener('submit', function(e) {
    e.preventDefault(); // Prevents the page from reloading
    
    const formData = new FormData(this);
    
    // Replace with your actual PythonAnywhere URL and endpoint
    fetch('https://www.pythonanywhere.com/user/ArcMethod/files/home/ArcMethod/mysite/flask_cleanup_app.py', {
        method: 'POST',
        body: formData
    })
    .then(response => response.text())
    .then(data => {
        alert('Data sent successfully!');
        console.log(data);
    })
    .catch(error => {
        console.error('Error:', error);
    });
});
</script>
