<div id="lead-form-container" style="max-width: 480px; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif; background: #f9fafb; padding: 24px; border-radius: 12px; border: 1px solid #e5e7eb;">
  <h3 style="margin-top: 0; color: #111827; font-size: 1.25rem;">How can we help you?</h3>
  <form id="dynamicLeadForm">
    <div style="margin-bottom: 12px;">
      <label style="display: block; font-size: 0.875rem; font-weight: 600; color: #374151; margin-bottom: 4px;">First Name *</label>
      <input type="text" name="first_name" required style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box;">
    </div>
    <div style="margin-bottom: 12px;">
      <label style="display: block; font-size: 0.875rem; font-weight: 600; color: #374151; margin-bottom: 4px;">Last Name</label>
      <input type="text" name="last_name" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box;">
    </div>
    <div style="margin-bottom: 12px;">
      <label style="display: block; font-size: 0.875rem; font-weight: 600; color: #374151; margin-bottom: 4px;">Phone Number</label>
      <input type="tel" name="phone_number" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box;">
    </div>
    <div style="margin-bottom: 12px;">
      <label style="display: block; font-size: 0.875rem; font-weight: 600; color: #374151; margin-bottom: 4px;">Email Address *</label>
      <input type="email" name="email" required style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box;">
    </div>
    <div style="margin-bottom: 16px;">
      <label style="display: block; font-size: 0.875rem; font-weight: 600; color: #374151; margin-bottom: 4px;">What concern can we help you with? *</label>
      <textarea name="concern" rows="4" required style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box;"></textarea>
    </div>
    <button type="submit" style="width: 100%; background-color: #2563eb; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer;">Submit Inquiry</button>
  </form>
  <div id="formResponse" style="margin-top: 12px; font-size: 0.875rem; text-align: center;"></div>
</div>

<script>
document.getElementById('dynamicLeadForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const responseDiv = document.getElementById('formResponse');
  const formData = Object.fromEntries(new FormData(this).entries());

  // REPLACE with your actual PythonAnywhere Flask endpoint URL
  const API_URL = 'https://www.ArcMethod.pythonanywhere.com';

  try {
    responseDiv.style.color = '#4b5563';
    responseDiv.textContent = 'Sending...';

    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(formData)
    });

    const result = await res.json();
    if (res.ok) {
      responseDiv.style.color = '#16a34a';
      responseDiv.textContent = 'Thank you! Your message has been sent.';
      this.reset();
    } else {
      responseDiv.style.color = '#dc2626';
      responseDiv.textContent = result.error || 'Something went wrong.';
    }
  } catch (err) {
    responseDiv.style.color = '#dc2626';
    responseDiv.textContent = 'Failed to connect to the server.';
  }
});
</script>
