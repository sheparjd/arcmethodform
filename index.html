<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Support</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-height-screen py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-md border border-gray-100">
        <div>
            <h2 class="text-center text-3xl font-extrabold text-gray-900 tracking-tight">Get in Touch</h2>
            <p class="mt-2 text-center text-sm text-gray-600">Please fill out the form below and our team will follow up shortly.</p>
        </div>
        
        <form id="leadForm" class="mt-8 space-y-6">
            <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-2">
                <div>
                    <label for="first_name" class="block text-sm font-medium text-gray-700">First name</label>
                    <input type="text" id="first_name" name="first_name" required autocomplete="given-name"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>

                <div>
                    <label for="last_name" class="block text-sm font-medium text-gray-700">Last name</label>
                    <input type="text" id="last_name" name="last_name" required autocomplete="family-name"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email address</label>
                <input type="email" id="email" name="email" required autocomplete="email"
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>

            <div>
                <label for="phone" class="block text-sm font-medium text-gray-700">Phone number</label>
                <input type="tel" id="phone" name="phone" required autocomplete="tel"
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>

            <div>
                <label for="concern" class="block text-sm font-medium text-gray-700">What concern can we help you with?</label>
                <textarea id="concern" name="concern" rows="4" required
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"></textarea>
            </div>

            <div>
                <button type="submit" id="submitBtn"
                    class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150">
                    Submit Request
                </button>
            </div>
            
            <div id="responseMessage" class="hidden text-sm text-center font-medium mt-4"></div>
        </form>
    </div>

    <script>
        document.getElementById('leadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const msgBox = document.getElementById('responseMessage');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';
            msgBox.classList.add('hidden');

            const formData = {
                first_name: document.getElementById('first_name').value,
                last_name: document.getElementById('last_name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                concern: document.getElementById('concern').value
            };

            try {
                const response = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                msgBox.classList.remove('hidden');
                if (response.ok) {
                    msgBox.className = "text-sm text-center font-medium mt-4 text-green-600";
                    msgBox.textContent = "Thank you! Your request has been submitted.";
                    document.getElementById('leadForm').reset();
                } else {
                    throw new Error(result.error || "Submission failed.");
                }
            } catch (error) {
                msgBox.classList.remove('hidden');
                msgBox.className = "text-sm text-center font-medium mt-4 text-red-600";
                msgBox.textContent = error.message || "An unexpected error occurred.";
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Request';
            }
        });
    </script>
</body>
</html>
