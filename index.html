<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Support</title>
    <!-- Standard CSS Fallback for reliable cross-domain rendering -->
    <style>
        body {
            background-color: #f9fafb;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 3rem 1rem;
            box-sizing: border-box;
        }
        *, *:before, *:after {
            box-sizing: inherit;
        }
        .form-container {
            max-width: 28rem;
            width: 100%;
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #f3f4f6;
        }
        .form-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .form-header h2 {
            font-size: 1.875rem;
            font-weight: 800;
            color: #111827;
            margin: 0 0 0.5rem 0;
            letter-tight: -0.025em;
        }
        .form-header p {
            font-size: 0.875rem;
            color: #4b5563;
            margin: 0;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }
        @media (min-width: 640px) {
            .grid-2 {
                grid-template-columns: 1fr 1fr;
            }
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #374151;
            margin-bottom: 0.25rem;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.625rem 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            background-color: #ffffff;
            color: #111827;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        .submit-btn {
            width: 100%;
            display: inline-flex;
            justify-content: center;
            padding: 0.625rem 1rem;
            border: 1px solid transparent;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: #ffffff;
            background-color: #4f46e5;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            cursor: pointer;
            transition: background-color 0.15s ease;
        }
        .submit-btn:hover {
            background-color: #4338ca;
        }
        .submit-btn:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }
        .msg-box {
            font-size: 0.875rem;
            text-align: center;
            font-weight: 500;
            margin-top: 1rem;
            display: none;
        }
        .msg-success {
            color: #16a34a;
        }
        .msg-error {
            color: #dc2626;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="form-header">
            <h2>Get in Touch</h2>
            <p>Please fill out the form below and our team will follow up shortly.</p>
        </div>
        
        <form id="leadForm">
            <div class="grid-2">
                <div class="form-group">
                    <label for="first_name">First name</label>
                    <input type="text" id="first_name" name="first_name" required autocomplete="given-name">
                </div>

                <div class="form-group">
                    <label for="last_name">Last name</label>
                    <input type="text" id="last_name" name="last_name" required autocomplete="family-name">
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="phone">Phone number</label>
                <input type="tel" id="phone" name="phone" required autocomplete="tel">
            </div>

            <div class="form-group">
                <label for="concern">What concern can we help you with?</label>
                <textarea id="concern" name="concern" rows="4" required></textarea>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">
                Submit Request
            </button>
            
            <div id="responseMessage" class="msg-box"></div>
        </form>
    </div>

    <script>
        document.getElementById('leadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const msgBox = document.getElementById('responseMessage');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';
            msgBox.style.display = 'none';

            const formData = {
                first_name: document.getElementById('first_name').value,
                last_name: document.getElementById('last_name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                concern: document.getElementById('concern').value
            };

            try {
                const response = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                msgBox.style.display = 'block';
                if (response.ok) {
                    msgBox.className = "msg-box msg-success";
                    msgBox.textContent = "Thank you! Your request has been submitted.";
                    document.getElementById('leadForm').reset();
                } else {
                    throw new Error(result.error || "Submission failed.");
                }
            } catch (error) {
                msgBox.style.display = 'block';
                msgBox.className = "msg-box msg-error";
                msgBox.textContent = error.message || "An unexpected error occurred.";
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Request';
            }
        });
    </script>
</body>
</html>
